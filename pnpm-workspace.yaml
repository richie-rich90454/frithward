packages:
    - apps/*
    - packages/*
    - services/*
    - tools/*
    - engines/*
allowBuilds:
    # Native addon builds are opt-in here so pnpm lifecycle never hard-fails.
    # scripts/provision-c2pa.mjs retries provisioning separately and degrades honestly.
    "@contentauth/c2pa-node": false
    esbuild: true
    onnxruntime-node: false
    protobufjs: false
    tesseract.js: false
