[package]
name = "frithward-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "frithward"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
frithward-runtime = { path = "../frithward-runtime" }
frithward-media = { path = "../frithward-media" }
frithward-privacy = { path = "../frithward-privacy" }
frithward-provenance = { path = "../frithward-provenance" }
