<!doctype html>
<!-- Offline support: public/sw.js precaches the built app shell so repeat visits work without a network. -->
<!-- Cross-origin isolation (COOP/COEP) must be set by the host as response headers; a meta tag or a
     service worker cannot set them. Header configs shipped: public/_headers (Netlify/Cloudflare Pages),
     netlify.toml (Netlify), vercel.json (Vercel), infrastructure/deployment/Caddyfile (self-host), and
     public/hosting-headers.json (exact name/value pairs for any other host). Without these headers only
     SharedArrayBuffer-backed Whisper pthreads transcription is unavailable; all other features work. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Frithward — Keep people safe. Keep media honest.</title>
        <meta
            name="description"
            content="Frithward is a local-first, open-source digital safety toolkit for captions, media checks, privacy inspection, and provenance."
        />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#FFFFFF" />
        <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
        <link rel="canonical" href="https://github.com/richie-rich90454/frithward" />
        <link rel="icon" href="/symbol.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/symbol.svg" />
        <link rel="manifest" href="/site.webmanifest" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Frithward" />
        <meta property="og:title" content="Frithward — Keep people safe. Keep media honest." />
        <meta
            property="og:description"
            content="Frithward is a local-first, open-source digital safety toolkit for captions, media checks, privacy inspection, and provenance."
        />
        <meta property="og:url" content="https://github.com/richie-rich90454/frithward" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:image" content="/og-image.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Frithward wordmark and symbol on a white background."
        />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Frithward — Keep people safe. Keep media honest." />
        <meta
            name="twitter:description"
            content="Frithward is a local-first, open-source digital safety toolkit for captions, media checks, privacy inspection, and provenance."
        />
        <meta name="twitter:image" content="/og-image.png" />
        <meta
            name="twitter:image:alt"
            content="Frithward wordmark and symbol on a white background."
        />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "SoftwareApplication",
                "name": "Frithward",
                "applicationCategory": "SecurityApplication",
                "operatingSystem": "Web browser",
                "license": "https://www.apache.org/licenses/LICENSE-2.0",
                "url": "https://github.com/richie-rich90454/frithward",
                "description": "Frithward is a local-first, open-source digital safety toolkit for captions, media checks, privacy inspection, and provenance.",
                "offers": {
                    "@type": "Offer",
                    "price": "0",
                    "priceCurrency": "USD"
                }
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <noscript>
            <p>
                Frithward needs JavaScript to run. Please enable JavaScript in your browser, then
                reload this page.
            </p>
        </noscript>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
