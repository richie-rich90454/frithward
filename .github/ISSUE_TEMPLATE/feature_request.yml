name: Feature request
description: Propose a capability or improvement, grounded in a real problem
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal. Please describe the problem before the solution, and do not paste victims' private information or non-consensual media into a public issue. The smallest complete change is preferred over a broad wish list.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected, and in what situation? For safety or privacy features, say what outcome would improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest complete change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider, and why is this approach better?
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Web app
        - Desktop app (Tauri)
        - Browser extension
        - Public proof page
        - API or other service
        - Python engine
        - Rust crate
        - Build or tooling
        - Documentation
      default: Web app
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Link research, standards, or measured results. Do not invent numbers; write "not measured" where no measurement exists.
    validations:
      required: false
  - type: checkboxes
    id: principles
    attributes:
      label: Alignment check
      options:
        - label: This keeps local execution the default and does not require uploading user data.
          required: false
        - label: This does not enable impersonation or the use of non-consensual identity data.
          required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include victims' private information in this request.
          required: true
