name: Bug report
description: Report something that does not work as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste victims' private information, real messages, or non-consensual media into a public issue. Use synthetic or consented examples to reproduce the problem. For security vulnerabilities, use private reporting instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that reproduces the issue, including the command or UI path.
      placeholder: |
        1. Run `pnpm run ...`
        2. Open ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: State what you expected and what happened instead. Include the exact error text if there is one.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      description: Where did the problem occur?
      options:
        - Web app
        - Desktop app (Tauri)
        - Browser extension
        - Public proof page
        - API or other service
        - Python engine
        - Rust crate
        - Build or tooling
        - Documentation
      default: Web app
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Only for web, extension, or public-proof issues.
      placeholder: e.g. Firefox 141, Chrome 140
    validations:
      required: false
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: e.g. v26.0.0
    validations:
      required: false
  - type: input
    id: pnpm
    attributes:
      label: pnpm version
      description: Output of `pnpm --version`.
      placeholder: e.g. 10.0.0
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Frithward version or commit
      placeholder: e.g. 0.1.0 or commit hash
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste errors or logs, with any personal data removed.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private or identifying information from this report.
          required: true
