[project]
name = "frithward-sdk"
version = "0.1.0"
description = "Typed Python client for the Frithward API"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frithward_sdk"]
