[project]
name = "image-detection"
version = "0.0.1"
description = "Image synthetic media detection engine."
requires-python = ">=3.12"
dependencies = ["pydantic", "torch", "onnx"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
