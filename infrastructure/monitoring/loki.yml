# Loki configuration for Frithward self-hosted logs.
# Services write JSON logs to /var/log/frithward/*.log; Loki tails those files
# from the positions file. Change paths to match your deployment.
auth_enabled: false
server:
    http_listen_port: 3100
common:
    path_prefix: /var/lib/loki
    storage:
        filesystem:
            chunks_directory: /var/lib/loki/chunks
            rules_directory: /var/lib/loki/rules
    replication_factor: 1
    ring:
        instance_addr: 127.0.0.1
        kvstore:
            store: inmemory
schema_config:
    configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
              prefix: index_
              period: 24h
ingester:
    wal:
        enabled: true
        dir: /var/lib/loki/wal
positions:
    filename: /var/lib/loki/positions.yaml
scrape_configs:
    - job_name: frithward-services
      static_configs:
          - targets: [127.0.0.1]
            labels:
                job: frithward
                __path__: /var/log/frithward/*.log
