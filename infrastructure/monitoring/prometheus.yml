# Scrape configuration for a single-host Frithward deployment.
# Each service exposes /metrics on its own port; adjust the host if services
# run on separate machines. No container runtime is assumed.
global:
    scrape_interval: 15s
    evaluation_interval: 15s
scrape_configs:
    - job_name: api
      static_configs:
          - targets: ["127.0.0.1:3000"]
    - job_name: orchestrator
      static_configs:
          - targets: ["127.0.0.1:3001"]
    - job_name: media-worker
      static_configs:
          - targets: ["127.0.0.1:3002"]
    - job_name: inference-worker
      static_configs:
          - targets: ["127.0.0.1:3003"]
    - job_name: community
      static_configs:
          - targets: ["127.0.0.1:3004"]
    - job_name: incident
      static_configs:
          - targets: ["127.0.0.1:3005"]
