# OpenTelemetry Collector configuration.
# Set OTEL_EXPORTER_OTLP_ENDPOINT (for example https://collector.example.com:4318)
# before starting the collector. Traces and metrics are also exposed locally in
# Prometheus format on :9464 for scraping. No container runtime is required.
receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318
processors:
    batch:
        timeout: 5s
exporters:
    otlphttp:
        endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
        tls:
            insecure: false
    prometheus:
        endpoint: 0.0.0.0:9464
service:
    pipelines:
        traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp]
        metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheus, otlphttp]
    telemetry:
        logs:
            level: info
