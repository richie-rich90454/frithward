# pgBackRest configuration for a self-hosted Frithward PostgreSQL 18 database.
# Install at /etc/pgbackrest/pgbackrest.conf (or pass --config=<this file>).
# The stanza name "main" must match the stanza used by archive_command in
# postgresql.conf. Update pg1-path to your PostgreSQL 18 data directory.
#
# Schedule backups from the host, e.g.:
#   pgbackrest --stanza=main --type=full backup
#   pgbackrest --stanza=main --type=diff backup
# See docs/deployment.md for the restore procedure. No container runtime is used.
[global]
repo1-path=/var/lib/pgbackrest
repo1-type=posix
# Keep 14 full backups and 7 differential backups before expiry.
repo1-retention-full=14
repo1-retention-diff=7
# zstd gives a good speed/size trade-off for media-related metadata.
compress-type=zstd
compress-level=3
start-fast=y
process-max=4
log-level-console=info

[main]
pg1-path=/var/lib/postgresql/18/main
