services:
    web:
        build:
            context: ../../apps/web
            dockerfile: ../../infrastructure/docker/Dockerfile.web
        ports:
            - "4173:80"
    api:
        build:
            context: ../../services/api
            dockerfile: ../../infrastructure/docker/Dockerfile.api
        environment:
            PORT: "3000"
            DATABASE_URL: postgres://frithward:frithward@postgres:5432/frithward
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - "3000:3000"
    postgres:
        image: postgres:18
        environment:
            POSTGRES_USER: frithward
            POSTGRES_PASSWORD: frithward
            POSTGRES_DB: frithward
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U frithward"]
            interval: 5s
            timeout: 3s
            retries: 10
volumes:
    pgdata:
